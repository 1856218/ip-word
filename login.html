<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 线条小狗IP乐园</title>
  <!-- 全局独立CSS -->
  <link rel="stylesheet" href="./css/global.css">
  <!-- 页面嵌入式CSS -->
  <style>
    /* 登录页特有样式补充 */
    .login-card {
      min-height: 420px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-subtitle {
      text-align: center;
      color: var(--text-light);
      font-size: 14px;
      margin-bottom: 30px;
    }

    .remember-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 12px 0;
      font-size: 14px;
      color: var(--text-light);
    }

    .remember-wrap input[type="checkbox"] {
      width: auto;
      margin: 0;
      cursor: pointer;
    }

    /* 演示账号提示 */
    .demo-tip {
      background: var(--primary-light);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: var(--text);
      border-left: 3px solid var(--primary);
    }

    .demo-tip strong {
      color: var(--primary-dark);
    }
  </style>
<base target="_blank">
</head>
<body>
  <!-- 返回首页 -->
  <div class="back-home">
    <a href="index.html">← 返回首页</a>
  </div>

  <!-- 登录容器 -->
  <div class="login-wrap">
    <div class="login-card">
      <h2 class="login-title">🔐 账号登录</h2>
      <p class="login-subtitle">登录后解锁更多专属内容</p>

      <!-- 演示账号提示 -->
      <div class="demo-tip">
        <strong>💡 演示账号：</strong>admin123 / 123456<br>
        <span style="font-size: 12px; color: var(--text-light);">（也可自行注册新账号）</span>
      </div>

      <!-- 账号输入 -->
      <div class="form-group">
        <input 
          type="text" 
          id="login-acc" 
          class="form-input" 
          placeholder="请输入账号（6-16位）"
          autocomplete="username"
        >
        <div class="input-hint">账号格式错误</div>
      </div>

      <!-- 密码输入 -->
      <div class="form-group">
        <input 
          type="password" 
          id="login-pwd" 
          class="form-input" 
          placeholder="请输入密码（至少6位）"
          autocomplete="current-password"
        >
        <div class="input-hint">密码格式错误</div>
      </div>

      <!-- 记住我 -->
      <div class="remember-wrap">
        <input type="checkbox" id="remember-me">
        <label for="remember-me">记住用户名</label>
      </div>

      <!-- 登录按钮 -->
      <button class="btn" onclick="loginCheck()">登 录</button>

      <!-- 跳转注册超链接 -->
      <div class="link-reg">
        没有账号？<a href="register.html">点这里注册 →</a>
      </div>
    </div>
  </div>

  <!-- 加载交互工具js -->
  <script src="./js/app.js"></script>

  <!-- 登录页特有逻辑 -->
  <script>
    // 页面加载时检查是否记住用户名
    document.addEventListener('DOMContentLoaded', function() {
      const savedAcc = localStorage.getItem('rememberAccount');
      if (savedAcc) {
        document.getElementById('login-acc').value = savedAcc;
        document.getElementById('remember-me').checked = true;
      }
    });

    // 重写loginCheck，增加记住用户名功能
    const originalLoginCheck = loginCheck;
    loginCheck = function() {
      const remember = document.getElementById('remember-me').checked;
      const acc = document.getElementById('login-acc').value.trim();

      if (remember && acc) {
        localStorage.setItem('rememberAccount', acc);
      } else {
        localStorage.removeItem('rememberAccount');
      }

      return originalLoginCheck();
    };
  </script>
</body>
</html>
